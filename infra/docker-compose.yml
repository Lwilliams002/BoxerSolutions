name: servicefinance

services:
  postgres:
    image: postgres:16-alpine
    container_name: sfa-postgres
    environment:
      POSTGRES_USER: sfa
      POSTGRES_PASSWORD: sfa_dev_password
      POSTGRES_DB: servicefinance
    ports:
      - "5433:5432"
    volumes:
      - sfa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfa -d servicefinance"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO emulates Wasabi's S3-compatible API for local development.
  # In staging/production, point STORAGE_ENDPOINT at Wasabi instead.
  minio:
    image: minio/minio:latest
    container_name: sfa-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sfa-storage-key
      MINIO_ROOT_PASSWORD: sfa-storage-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sfa_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 sfa-storage-key sfa-storage-secret &&
      mc mb --ignore-existing local/servicefinance-files &&
      exit 0
      "

volumes:
  sfa_pgdata:
  sfa_minio:
